<svg xmlns="http://www.w3.org/2000/svg" width="850" height="44" viewBox="0 0 850 44">
  <defs>
    <linearGradient id="l" x1="0" x2="1"><stop offset="0%" stop-color="#b18cff"/><stop offset="100%" stop-color="#b18cff" stop-opacity="0"/></linearGradient>
    <filter id="sg" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="2.2" result="g"/><feMerge><feMergeNode in="g"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <style>
      .sp { animation: tw 3s ease-in-out infinite; }
      .dot { animation: tw 3s ease-in-out infinite; }
      @keyframes tw { 0%,100% { opacity: .25; } 50% { opacity: 1; } }
      .shoot { animation: shoot 7s ease-in infinite; }
      .shoot2 { animation: shoot 9s ease-in 3.5s infinite; }
      @keyframes shoot { 0% { transform: translate(0,0); opacity: 0; } 3% { opacity: 1; } 14% { transform: translate(420px,160px); opacity: 0; } 100% { transform: translate(420px,160px); opacity: 0; } }
      .f { animation: fi 1.4s ease-out both; }
      .d1 { animation-delay: .3s; } .d2 { animation-delay: .6s; } .d3 { animation-delay: .9s; }
      @keyframes fi { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: none; } }
</style>
  </defs>
